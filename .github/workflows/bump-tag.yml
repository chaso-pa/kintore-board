name: Bump Tag

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  bump-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
